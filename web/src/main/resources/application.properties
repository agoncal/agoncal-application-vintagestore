quarkus.application.name=Contoso Store
quarkus.log.level=INFO
quarkus.log.console.format=%-5p [%c{3.}] %s%e%n
quarkus.log.category."dev.langchain4j".level=INFO
quarkus.log.category."org.agoncal.application.contosostore".level=INFO
quarkus.log.category."dev.langchain4j.mcp.client.transport".level=WARN
# Database configuration
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/contosostore_database?user=contosostore&password=contosostore
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.schema-management.create-schemas=true
quarkus.hibernate-orm.scripts.generation=drop-and-create
quarkus.hibernate-orm.scripts.generation.create-target=create.sql
quarkus.hibernate-orm.scripts.generation.drop-target=drop.sql
quarkus.hibernate-orm.sql-load-script=contosostore-data.sql
