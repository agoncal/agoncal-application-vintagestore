<svg xmlns="http://www.w3.org/2000/svg" width="512" height="408" viewBox="0 0 512 408">
  <defs>
    <linearGradient id="cs-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="cs-logo-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0e4ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect x="8" y="8" width="496" height="392" rx="64" ry="64" fill="url(#cs-logo-bg)"/>
  <!-- "CS" letters -->
  <text x="256" y="290" font-family="Arial, Helvetica, sans-serif" font-size="240" font-weight="bold"
        text-anchor="middle" fill="url(#cs-logo-text)">CS</text>
</svg>
